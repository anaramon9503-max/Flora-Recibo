<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recibos | Flora Rodulfo Photography</title>
<style>
:root{
  --bg:#efe8df; --panel:#17130f; --panel2:#201a15;
  --gold:#c99a52; --gold2:#e1bf87; --cream:#fffaf4;
  --paper:#fffdf9; --ink:#211915; --muted:#87796b; --line:#e4d8c8;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,#efe8df,#e7ddd2);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
.app{
  max-width:1460px;margin:auto;padding:16px;
  display:grid;grid-template-columns:390px minmax(0,1fr);gap:22px;align-items:start;
}
.panel{
  position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;
  padding:21px;border-radius:24px;
  color:#fff;background:linear-gradient(180deg,#1d1813,#110e0c);
  border:1px solid rgba(201,154,82,.2);
  box-shadow:0 20px 52px rgba(36,28,20,.2);
}
.eyebrow{font-size:10px;letter-spacing:.18em;color:#e4c792;margin-bottom:8px}
h1{margin:0;font:500 28px/1.05 Georgia,serif}
.intro{margin:8px 0 16px;color:#c9c1b8;font-size:12px;line-height:1.45}
.section{
  border-top:1px solid #332a23;padding-top:14px;margin-top:14px;
}
.section-title{font-size:10px;font-weight:700;letter-spacing:.13em;color:#e5cda5;margin-bottom:8px}
label{display:block;font-size:11px;color:#d8d1ca;margin:9px 0 5px}
input,textarea,select{
  width:100%;padding:11px 12px;border-radius:12px;border:1px solid #40352c;
  background:#1b1612;color:#fff;font:inherit;font-size:13px;outline:none;
}
textarea{min-height:68px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:#c99a52;box-shadow:0 0 0 3px rgba(201,154,82,.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.item{
  display:grid;grid-template-columns:1fr 1.1fr .65fr 38px;gap:7px;align-items:end;margin-bottom:7px;
}
.item button{
  height:40px;border:0;border-radius:10px;background:#3a2823;color:#ffd6d6;font-size:19px;cursor:pointer;
}
.btn{
  width:100%;border:0;border-radius:13px;padding:12px 13px;font-size:13px;font-weight:700;cursor:pointer;
}
.btn.gold{background:linear-gradient(135deg,#e5c58d,#c7954b);color:#20150f}
.btn.dark{background:#241d18;color:white;border:1px solid #40352d}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.note{font-size:10px;line-height:1.45;color:#9f958b;margin-top:9px}
.preview{display:flex;justify-content:center;min-width:0}
canvas{
  width:min(100%,820px);height:auto;background:#fffdf9;border-radius:18px;
  box-shadow:0 24px 65px rgba(61,47,34,.18);
}
@media(max-width:960px){
  .app{grid-template-columns:1fr;padding:8px}
  .panel{position:relative;top:auto;max-height:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="eyebrow">FLORA RODULFO PHOTOGRAPHY</div>
    <h1>Recibo</h1>
    

    <div class="section">
      <div class="section-title">DATOS</div>
      <div class="two">
        <div>
          <label>No. de recibo</label>
          <input id="numero">
        </div>
        <div>
          <label>Fecha</label>
          <input id="fecha" type="date">
        </div>
      </div>

      <label>Cliente</label>
      <input id="cliente" placeholder="Nombre del cliente">

      <label>Concepto general</label>
      <textarea id="conceptoGeneral">Servicios de fotografía con Flora Rodulfo Photography.</textarea>

      <div class="two">
        <div>
          <label>Método de pago</label>
          <select id="metodo">
            <option>Transferencia bancaria</option>
            <option>Efectivo</option>
            <option>Tarjeta</option>
            <option>Otro</option>
          </select>
        </div>
        <div>
          <label>Estado</label>
          <select id="estado">
            <option>Pagado</option>
            <option>Anticipo</option>
            <option>Pendiente</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">CONCEPTOS</div>
      <div id="items"></div>
      <button class="btn dark" type="button" onclick="addItem()">+ Agregar concepto</button>
    </div>

    <div class="section">
      <div class="section-title">FINAL</div>
      <label>Mensaje</label>
      <input id="mensaje" value="Gracias por confiar en Flora Rodulfo Photography.">
      <div class="actions">
        <button class="btn gold" type="button" onclick="downloadPNG()">Descargar PNG</button>
        <button class="btn dark" type="button" onclick="printReceipt()">Guardar PDF</button>
      </div>
      <div style="height:8px"></div>
      <button class="btn dark" type="button" onclick="newReceipt()">✨ Nuevo recibo / siguiente número</button>
      
    </div>
  </aside>

  <main class="preview">
    <canvas id="receipt" width="1240" height="1450"></canvas>
  </main>
</div>

const $=id=>document.getElementById(id);
const canvas=$('receipt');
let ctx=canvas.getContext('2d');

const LAST_KEY='floraReceiptLastNumber';
const CURRENT_KEY='floraReceiptCurrentNumber';

function pad(n){return String(Math.max(1,Number(n)||1)).padStart(6,'0')}
function today(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function prettyDate(v){
  if(!v)return '';
  const [y,m,d]=v.split('-').map(Number);
  const mm=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return d+' de '+mm[m-1]+' de '+y;
}
function money(n){
  return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n||0));
}
function loadNumber(){
  const cur=localStorage.getItem(CURRENT_KEY);
  if(cur){$('numero').value=pad(cur);return}
  const next=Math.max(1,Number(localStorage.getItem(LAST_KEY)||0)+1);
  $('numero').value=pad(next);
  localStorage.setItem(CURRENT_KEY,String(next));
}
function saveNumber(){
  const n=Number(String($('numero').value||'').replace(/\D/g,''))||1;
  $('numero').value=pad(n);
  localStorage.setItem(CURRENT_KEY,String(n));
}
function newReceipt(){
  const used=Number(String($('numero').value||'').replace(/\D/g,''))||1;
  const last=Math.max(Number(localStorage.getItem(LAST_KEY)||0),used);
  localStorage.setItem(LAST_KEY,String(last));
  localStorage.setItem(CURRENT_KEY,String(last+1));
  $('numero').value=pad(last+1);

  $('cliente').value='';
  $('conceptoGeneral').value='Servicios de fotografía con Flora Rodulfo Photography.';
  $('metodo').value='Transferencia bancaria';
  $('estado').value='Pagado';
  $('mensaje').value='Gracias por confiar en Flora Rodulfo Photography.';
  $('fecha').value=today();
  $('items').innerHTML='';
  addItem('Sesión fotográfica','Servicio de fotografía','500');
  draw();
}
function rr(x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}
}
function wrap(text,x,y,maxWidth,lineHeight,maxLines=3){
  const words=String(text||'').split(/\s+/);
  let line='',lines=[];
  for(const word of words){
    const test=line?line+' '+word:word;
    if(ctx.measureText(test).width>maxWidth&&line){
      lines.push(line);line=word;
      if(lines.length===maxLines-1)break;
    }else line=test;
  }
  if(line&&lines.length<maxLines)lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));
}
function fitSize(text,maxWidth,start,family='Georgia',weight='500'){
  let s=start;
  while(s>18){
    ctx.font=weight+' '+s+'px '+family;
    if(ctx.measureText(text).width<=maxWidth)break;
    s--;
  }
  return s;
}
function getItems(){
  return [...document.querySelectorAll('.item')].map(r=>({
    concept:r.querySelector('.concept').value.trim(),
    desc:r.querySelector('.desc').value.trim(),
    amount:r.querySelector('.amount').value
  })).filter(x=>x.concept||x.desc||Number(x.amount));
}
function addItem(concept='Sesión fotográfica',desc='Servicio de fotografía',amount='500'){
  const r=document.createElement('div');
  r.className='item';
  r.innerHTML=
    '<div><input class="concept" value="'+String(concept).replace(/"/g,'&quot;')+'"></div>'+
    '<div><input class="desc" value="'+String(desc).replace(/"/g,'&quot;')+'"></div>'+
    '<div><input class="amount" type="number" min="0" step="0.01" value="'+amount+'"></div>'+
    '<button type="button">×</button>';
  r.querySelector('button').onclick=()=>{r.remove();draw()};
  r.querySelectorAll('input').forEach(el=>el.addEventListener('input',draw));
  $('items').appendChild(r);
  draw();
}
function smallFlower(x,y){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle='#d8a89b';
  for(let i=0;i<5;i++){
    ctx.rotate(Math.PI*2/5);
    ctx.beginPath();ctx.ellipse(0,-10,5,10,0,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#c99a52';
  ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function paymentIcon(x,y){
  ctx.save();
  ctx.fillStyle='#2c1d17';
  ctx.beginPath();ctx.arc(x,y,23,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#dfbe88';ctx.lineWidth=2;
  ctx.strokeRect(x-8,y-10,16,20);
  ctx.beginPath();
  ctx.moveTo(x-4,y-4);ctx.lineTo(x+4,y-4);
  ctx.moveTo(x-4,y+1);ctx.lineTo(x+4,y+1);
  ctx.moveTo(x-4,y+6);ctx.lineTo(x+1,y+6);
  ctx.stroke();
  ctx.restore();
}
function fittedWrapped(text,x,y,maxWidth,maxLines=2,startSize=22,lineHeight=29){
  let size=startSize;
  while(size>=17){
    ctx.font='400 '+size+'px Georgia';
    const words=String(text||'').split(/\s+/);
    let line='',lines=1;
    for(const word of words){
      const t=line?line+' '+word:word;
      if(ctx.measureText(t).width>maxWidth&&line){lines++;line=word}else line=t;
    }
    if(lines<=maxLines)break;
    size--;
  }
  ctx.font='400 '+size+'px Georgia';
  wrap(text,x,y,maxWidth,lineHeight,maxLines);
}
const logo=new Image();
logo.src=LOGO;
logo.onload=draw;

function draw(){
  const items=getItems();
  const rows=Math.max(items.length,1);

  // altura dinámica: evita el hueco gigante
  const baseH=1380;
  canvas.height=baseH+(rows-1)*94;
  ctx=canvas.getContext('2d');

  const W=canvas.width,H=canvas.height;

  // fondo
  ctx.fillStyle='#fffaf4';ctx.fillRect(0,0,W,H);
  rr(36,36,W-72,H-72,24,'#fffdf9','#eadfd2');

  // HEADER - limpio y femenino
  rr(58,58,W-116,300,24,'#fff9f5','#eadfd2');

  // detalles delicados
  ctx.strokeStyle='#c99a52';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(90,102);ctx.lineTo(300,102);ctx.moveTo(W-300,102);ctx.lineTo(W-90,102);ctx.stroke();
  smallFlower(W/2,102);

  // logo dorado transparente
  if(logo.complete){
    const maxW=390,maxH=230;
    const ratio=Math.min(maxW/logo.width,maxH/logo.height);
    const w=logo.width*ratio,h=logo.height*ratio;
    ctx.drawImage(logo,88,118,w,h);
  }

  // recibo derecha
  ctx.fillStyle='#281f1a';
  ctx.font='500 80px Georgia';
  ctx.fillText('RECIBO',680,168);

  ctx.strokeStyle='#c99a52';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(680,205);ctx.lineTo(1015,205);ctx.stroke();

  ctx.fillStyle='#7f6d60';ctx.font='700 22px Georgia';
  ctx.fillText('No.',680,252);
  ctx.fillStyle='#c99a52';ctx.font='700 34px Arial';
  ctx.fillText($('numero').value||'000001',735,253);

  ctx.fillStyle='#7f6d60';ctx.font='700 22px Georgia';
  ctx.fillText('Fecha',680,305);
  ctx.fillStyle='#281f1a';ctx.font='400 24px Georgia';
  ctx.fillText(prettyDate($('fecha').value),760,305);

  // cliente
  ctx.fillStyle='#9a7f70';ctx.font='700 21px Georgia';
  ctx.fillText('Recibimos de:',78,430);

  const client=$('cliente').value.trim();
  if(client){
    const fs=fitSize(client,540,58,'"Brush Script MT", "Segoe Script", cursive','500');
    ctx.fillStyle='#1b1613';
    ctx.font='500 '+fs+'px "Brush Script MT","Segoe Script",cursive';
    ctx.fillText(client,78,497);
  }
  ctx.fillStyle='#d8a89b';ctx.fillRect(78,514,545,3);

  ctx.fillStyle='#281f1a';ctx.font='400 23px Georgia';
  ctx.fillText('Por concepto de:',78,567);
  ctx.fillStyle='#4a3e36';ctx.font='400 22px Georgia';
  wrap($('conceptoGeneral').value,286,567,340,31,3);

  // método de pago — caja alineada y sin desbordarse
  rr(704,396,448,246,22,'#fffaf7','#e3d5c7');
  paymentIcon(764,457);

  ctx.fillStyle='#9a7f70';ctx.font='700 19px Georgia';
  ctx.fillText('Método de pago',812,443);

  ctx.fillStyle='#281f1a';
  fittedWrapped($('metodo').value,812,479,275,2,22,29);

  ctx.strokeStyle='#e7ddd5';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(744,536);ctx.lineTo(1111,536);ctx.stroke();

  ctx.fillStyle='#9a7f70';ctx.font='700 19px Georgia';
  ctx.fillText('Estado de pago',744,578);

  ctx.fillStyle=$('estado').value==='Pagado'?'#9c6c43':'#a77f67';
  ctx.font='700 25px Georgia';
  ctx.fillText($('estado').value,744,612);

  ctx.strokeStyle='#d8a89b';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(1075,592,28,0,Math.PI*2);ctx.stroke();
  if($('estado').value==='Pagado'){
    ctx.beginPath();ctx.moveTo(1063,592);ctx.lineTo(1073,602);ctx.lineTo(1090,581);ctx.stroke();
  }

  // tabla
  const tx=60,ty=700,tw=1120,hh=62,rh=94;
  rr(tx,ty,tw,hh,16,'#2b1c17',null);
  ctx.fillStyle='#f7ecdf';ctx.font='700 17px Georgia';
  ctx.fillText('CONCEPTO',110,ty+39);
  ctx.fillText('DESCRIPCIÓN',505,ty+39);
  ctx.fillText('IMPORTE',990,ty+39);

  let y=ty+hh;
  for(let i=0;i<rows;i++){
    const it=items[i]||{concept:'',desc:'',amount:0};
    ctx.fillStyle=i%2===0?'#fffdf9':'#fcf7f3';ctx.fillRect(tx,y,tw,rh);
    ctx.strokeStyle='#eadfd7';ctx.strokeRect(tx,y,tw,rh);

    ctx.fillStyle='#2b1c17';ctx.beginPath();ctx.arc(92,y+47,18,0,Math.PI*2);ctx.fill();
    smallFlower(92,y+47);

    ctx.fillStyle='#281f1a';ctx.font='600 21px Georgia';
    wrap(it.concept||'Concepto',124,y+38,300,26,2);

    ctx.fillStyle='#554940';ctx.font='400 19px Georgia';
    wrap(it.desc||'Servicio de fotografía',474,y+36,350,25,2);

    ctx.fillStyle='#281f1a';ctx.font='700 23px Arial';ctx.textAlign='right';
    ctx.fillText(money(it.amount||0),1140,y+54);
    ctx.textAlign='left';
    y+=rh;
  }

  // total
  ctx.fillStyle='#fffdf9';ctx.fillRect(tx,y,tw,78);
  ctx.strokeStyle='#eadfd7';ctx.strokeRect(tx,y,tw,78);
  ctx.fillStyle='#9c6c43';ctx.font='700 27px Georgia';
  ctx.fillText('TOTAL',810,y+49);
  rr(940,y+10,220,58,12,'#2b1c17',null);
  const total=items.reduce((s,it)=>s+Number(it.amount||0),0);
  ctx.fillStyle='#fff8ed';ctx.font='700 28px Arial';ctx.textAlign='right';
  ctx.fillText(money(total),1138,y+49);
  ctx.textAlign='left';

  // footer inmediatamente después de la tabla
  const fy=y+120;
  ctx.fillStyle='#9a6d56';
  ctx.font='500 32px "Brush Script MT","Segoe Script",cursive';
  ctx.textAlign='center';
  ctx.fillText($('mensaje').value||'Gracias por confiar en Flora Rodulfo Photography.',W/2,fy);

  ctx.strokeStyle='#d8a89b';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(310,fy+28);ctx.lineTo(480,fy+28);ctx.moveTo(760,fy+28);ctx.lineTo(930,fy+28);ctx.stroke();
  smallFlower(W/2,fy+28);

  ctx.fillStyle='#81736b';ctx.font='400 20px Georgia';
  ctx.fillText('Momentos que se convierten en recuerdos.',W/2,fy+72);

  // pie oscuro delgado, no gigante
  const bandY=H-115;
  ctx.fillStyle='#2a1b17';
  ctx.beginPath();
  ctx.moveTo(36,bandY+20);
  ctx.quadraticCurveTo(W/2,bandY-35,W-36,bandY+20);
  ctx.lineTo(W-36,H-36);ctx.lineTo(36,H-36);ctx.closePath();ctx.fill();

  ctx.strokeStyle='#d8a89b';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(36,bandY+20);ctx.quadraticCurveTo(W/2,bandY-35,W-36,bandY+20);ctx.stroke();

  ctx.fillStyle='#e8cda9';ctx.font='400 17px Georgia';ctx.textAlign='center';
  ctx.fillText('Flora Rodulfo Photography',W/2,H-58);
  ctx.textAlign='left';
}

function downloadPNG(){
  draw();
  const a=document.createElement('a');
  a.download='recibo-flora-'+($('numero').value||'recibo')+'.png';
  a.href=canvas.toDataURL('image/png',1);
  document.body.appendChild(a);a.click();a.remove();
}
function printReceipt(){
  draw();
  const data=canvas.toDataURL('image/png',1);
  const w=window.open('','_blank');
  w.document.write('<html><head><title>Recibo Flora</title><style>html,body{margin:0;background:#fff}img{display:block;width:100%;max-width:210mm;margin:auto}@page{size:A4;margin:0}</style></head><body><img src="'+data+'" onload="window.print()"></body></html>');
  w.document.close();
}

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recibos · Flora Rodulfo Photography</title>
<style>
  :root{
    --black:#11100f;
    --warm:#f7f2e9;
    --paper:#fffdf9;
    --gold:#b98a46;
    --gold-soft:#d9c3a1;
    --ink:#201d19;
    --muted:#81786d;
    --line:#e9dfd0;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:#ece7de;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
  }
  .app{
    max-width:1440px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:390px minmax(0,1fr);
    gap:24px;
    align-items:start;
  }
  .editor{
    background:#171614;
    color:white;
    border-radius:26px;
    padding:22px;
    position:sticky;
    top:16px;
    max-height:calc(100vh - 32px);
    overflow:auto;
    box-shadow:0 18px 45px rgba(28,24,18,.16);
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.16em;
    color:#ccb58d;
    margin-bottom:7px;
  }
  h1{
    font-family:Georgia,serif;
    font-size:29px;
    line-height:1.06;
    margin:0 0 7px;
    font-weight:500;
  }
  .intro{
    color:#bbb2a8;
    font-size:12px;
    line-height:1.5;
    margin-bottom:18px;
  }
  .group{
    border-top:1px solid #2e2b27;
    padding-top:16px;
    margin-top:16px;
  }
  .group-title{
    font-size:11px;
    font-weight:700;
    letter-spacing:.11em;
    color:#d8c39f;
    margin-bottom:10px;
  }
  label{
    display:block;
    font-size:11px;
    color:#cfc7bd;
    margin:9px 0 5px;
  }
  input,select,textarea{
    width:100%;
    border:1px solid #37332e;
    background:#201e1b;
    color:#fff;
    border-radius:12px;
    padding:11px 12px;
    font:inherit;
    font-size:13px;
    outline:none;
  }
  textarea{min-height:70px;resize:vertical}
  input:focus,select:focus,textarea:focus{border-color:#a98550}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .line-item{
    display:grid;
    grid-template-columns:1.2fr .65fr 36px;
    gap:8px;
    margin-bottom:8px;
    align-items:end;
  }
  .remove{
    width:36px;height:40px;border:0;border-radius:10px;
    background:#332725;color:#e9c7be;font-size:18px;cursor:pointer;
  }
  .btn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:12px 14px;
    font-weight:700;
    cursor:pointer;
  }
  .btn.gold{background:#c2985a;color:#17120d}
  .btn.dark{background:#25231f;color:#fff;border:1px solid #39342d}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .muted-note{font-size:10px;color:#958c82;line-height:1.45;margin-top:10px}

  .preview-wrap{
    display:flex;
    justify-content:center;
  }
  canvas{
    width:min(100%,820px);
    height:auto;
    background:var(--paper);
    border-radius:18px;
    box-shadow:0 22px 58px rgba(47,40,31,.18);
  }
  @media(max-width:920px){
    .app{grid-template-columns:1fr;padding:10px}
    .editor{position:relative;top:auto;max-height:none}
  }
</style>
</head>
<body>
<div class="app">
  <section class="editor">
    <div class="eyebrow">FLORA RODULFO PHOTOGRAPHY</div>
    <h1>Recibo elegante</h1>
    <div class="intro">Diseño limpio, sin tanta cosa. El cliente inicia vacío y se limpia al crear el siguiente recibo.</div>

    <div class="group">
      <div class="group-title">DATOS</div>
      <div class="two">
        <div>
          <label>Recibo</label>
          <input id="numero">
        </div>
        <div>
          <label>Fecha</label>
          <input id="fecha" type="date">
        </div>
      </div>
      <label>Cliente</label>
      <input id="cliente" placeholder="Nombre del cliente" value="">
      <label>Concepto general</label>
      <textarea id="conceptoGeneral">Servicio de fotografía.</textarea>
      <div class="two">
        <div>
          <label>Método</label>
          <select id="metodo">
            <option>Transferencia</option>
            <option>Efectivo</option>
            <option>Tarjeta</option>
            <option>Otro</option>
          </select>
        </div>
        <div>
          <label>Estado</label>
          <select id="estado">
            <option>Pagado</option>
            <option>Anticipo</option>
            <option>Pendiente</option>
          </select>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-title">CONCEPTOS</div>
      <div id="items"></div>
      <button class="btn dark" type="button" onclick="addItem()">+ Agregar concepto</button>
    </div>

    <div class="group">
      <div class="group-title">PIE</div>
      <label>Mensaje</label>
      <input id="mensaje" value="Gracias por confiar en Flora Rodulfo Photography.">
      <div class="actions">
        <button class="btn gold" type="button" onclick="downloadPNG()">Descargar PNG</button>
        <button class="btn dark" type="button" onclick="printReceipt()">Guardar PDF</button>
      </div>
      <div style="height:8px"></div>
      <button class="btn dark" type="button" onclick="newReceipt()">Nuevo recibo / siguiente número</button>
      <div class="muted-note">El consecutivo se guarda en este navegador. El nombre del cliente no queda guardado.</div>
    </div>
  </section>

  <section class="preview-wrap">
    <canvas id="receipt" width="1240" height="1754"></canvas>
  </section>
</div>

const $=id=>document.getElementById(id);
const canvas=$('receipt');
const ctx=canvas.getContext('2d');

const LAST_KEY='floraReceiptLastNumber';
const CURRENT_KEY='floraReceiptCurrentNumber';

function pad(n){return String(Math.max(1,Number(n)||1)).padStart(6,'0')}
function today(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function loadNumber(){
  const cur=localStorage.getItem(CURRENT_KEY);
  if(cur){$('numero').value=pad(cur);return}
  const next=Math.max(1,Number(localStorage.getItem(LAST_KEY)||0)+1);
  $('numero').value=pad(next);
  localStorage.setItem(CURRENT_KEY,String(next));
}
function saveCurrent(){
  const n=Number(String($('numero').value||'').replace(/\D/g,''))||1;
  $('numero').value=pad(n);
  localStorage.setItem(CURRENT_KEY,String(n));
}
function newReceipt(){
  const used=Number(String($('numero').value||'').replace(/\D/g,''))||1;
  const last=Math.max(Number(localStorage.getItem(LAST_KEY)||0),used);
  localStorage.setItem(LAST_KEY,String(last));
  localStorage.setItem(CURRENT_KEY,String(last+1));
  $('numero').value=pad(last+1);

  $('cliente').value='';
  $('conceptoGeneral').value='Servicio de fotografía.';
  $('metodo').value='Transferencia';
  $('estado').value='Pagado';
  $('mensaje').value='Gracias por confiar en Flora Rodulfo Photography.';
  $('fecha').value=today();
  $('items').innerHTML='';
  addItem('Servicio fotográfico','500');
  draw();
  window.scrollTo({top:0,behavior:'smooth'});
}
function money(n){
  return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n||0));
}
function prettyDate(v){
  if(!v)return '';
  const [y,m,d]=v.split('-').map(Number);
  const mm=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return d+' de '+mm[m-1]+' de '+y;
}
function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}
}
function wrap(text,x,y,maxWidth,lineHeight,maxLines=3){
  const words=String(text||'').split(/\s+/);
  let line='',lines=[];
  for(const word of words){
    const t=line?line+' '+word:word;
    if(ctx.measureText(t).width>maxWidth&&line){
      lines.push(line);line=word;
      if(lines.length===maxLines-1)break;
    } else line=t;
  }
  if(line&&lines.length<maxLines)lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));
}
function fit(text,maxWidth,size){
  while(size>20){
    ctx.font='500 '+size+'px Georgia';
    if(ctx.measureText(text).width<=maxWidth)break;
    size--;
  }
  return size;
}
function addItem(desc='Servicio fotográfico',amount='500'){
  const row=document.createElement('div');
  row.className='line-item';
  row.innerHTML='<div><input class="desc" value="'+String(desc).replace(/"/g,'&quot;')+'"></div>'+
                '<div><input class="amount" type="number" min="0" step="0.01" value="'+amount+'"></div>'+
                '<button class="remove" type="button">×</button>';
  row.querySelector('.remove').onclick=()=>{row.remove();draw()};
  row.querySelectorAll('input').forEach(i=>i.addEventListener('input',draw));
  $('items').appendChild(row);
  draw();
}
function getItems(){
  return [...document.querySelectorAll('.line-item')].map(r=>({
    desc:r.querySelector('.desc').value.trim(),
    amount:r.querySelector('.amount').value
  })).filter(x=>x.desc||Number(x.amount));
}

const logo=new Image();
logo.src=LOGO;
logo.onload=draw;

function draw(){
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fffdf9';ctx.fillRect(0,0,W,H);

  // Hairline frame
  ctx.strokeStyle='#d9c3a1';ctx.lineWidth=3;
  ctx.strokeRect(46,46,W-92,H-92);

  // Header
  ctx.fillStyle='#11100f';ctx.fillRect(46,46,W-92,300);

  if(logo.complete){
    const maxW=360,maxH=200;
    const r=Math.min(maxW/logo.width,maxH/logo.height);
    ctx.drawImage(logo,95,92,logo.width*r,logo.height*r);
  }

  ctx.fillStyle='#d5b680';
  ctx.font='400 22px Arial';
  ctx.letterSpacing='4px';
  ctx.fillText('RECIBO',790,115);

  ctx.fillStyle='#fffaf1';
  ctx.font='500 54px Georgia';
  ctx.fillText('Flora Rodulfo',790,185);
  ctx.font='400 26px Georgia';
  ctx.fillStyle='#d9c3a1';
  ctx.fillText('Photography',790,225);

  ctx.fillStyle='#c2985a';ctx.fillRect(790,253,260,2);
  ctx.fillStyle='#fff7eb';
  ctx.font='400 22px Arial';
  ctx.fillText('No. '+($('numero').value||'000001'),790,295);
  ctx.fillText(prettyDate($('fecha').value),790,328);

  // Client block
  ctx.fillStyle='#7b6b58';
  ctx.font='700 18px Arial';
  ctx.fillText('RECIBIMOS DE',88,445);

  const client=$('cliente').value||'Nombre del cliente';
  const s=fit(client,720,54);
  ctx.fillStyle='#201d19';
  ctx.font='500 '+s+'px Georgia';
  ctx.fillText(client,88,510);

  ctx.fillStyle='#c9ad7b';ctx.fillRect(88,535,700,2);

  ctx.fillStyle='#7b6b58';
  ctx.font='700 18px Arial';
  ctx.fillText('POR CONCEPTO DE',88,590);
  ctx.fillStyle='#332e28';
  ctx.font='400 24px Arial';
  wrap($('conceptoGeneral').value,88,630,700,34,3);

  // Payment card
  roundRect(840,410,310,235,20,'#f7f2e9','#e3d6c0');
  ctx.fillStyle='#7b6b58';
  ctx.font='700 16px Arial';
  ctx.fillText('MÉTODO',872,458);
  ctx.fillStyle='#201d19';
  ctx.font='500 25px Georgia';
  ctx.fillText($('metodo').value,872,500);

  ctx.fillStyle='#e2d7c8';ctx.fillRect(872,532,245,1);
  ctx.fillStyle='#7b6b58';
  ctx.font='700 16px Arial';
  ctx.fillText('ESTADO',872,570);
  ctx.fillStyle='#9b6f33';
  ctx.font='600 30px Georgia';
  ctx.fillText($('estado').value,872,615);

  // Table
  const items=getItems();
  const x=70,y0=760,w=1100,hh=62,rh=84;
  ctx.fillStyle='#151411';ctx.fillRect(x,y0,w,hh);
  ctx.fillStyle='#d9c3a1';
  ctx.font='700 16px Arial';
  ctx.fillText('CONCEPTO',100,y0+39);
  ctx.fillText('DETALLE',520,y0+39);
  ctx.fillText('IMPORTE',1000,y0+39);

  let y=y0+hh;
  const rows=Math.max(items.length,1);
  for(let i=0;i<rows;i++){
    const it=items[i]||{desc:'',amount:0};
    ctx.fillStyle=i%2===0?'#fffdf9':'#faf6ef';
    ctx.fillRect(x,y,w,rh);
    ctx.strokeStyle='#eee4d7';ctx.strokeRect(x,y,w,rh);

    ctx.fillStyle='#201d19';
    ctx.font='500 23px Georgia';
    ctx.fillText(it.desc||'Concepto',100,y+51);

    ctx.fillStyle='#81786d';
    ctx.font='400 19px Arial';
    ctx.fillText('Flora Rodulfo Photography',520,y+51);

    ctx.fillStyle='#201d19';
    ctx.font='600 24px Arial';
    ctx.textAlign='right';
    ctx.fillText(money(it.amount),1135,y+52);
    ctx.textAlign='left';

    y+=rh;
  }

  const total=items.reduce((a,b)=>a+Number(b.amount||0),0);
  ctx.fillStyle='#201d19';
  ctx.font='700 18px Arial';
  ctx.fillText('TOTAL',825,y+65);
  ctx.font='600 38px Georgia';
  ctx.fillStyle='#9b6f33';
  ctx.textAlign='right';
  ctx.fillText(money(total),1135,y+68);
  ctx.textAlign='left';

  // Footer
  ctx.strokeStyle='#d9c3a1';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(88,H-310);ctx.lineTo(W-88,H-310);ctx.stroke();

  ctx.fillStyle='#201d19';
  ctx.font='italic 34px Georgia';
  ctx.textAlign='center';
  ctx.fillText($('mensaje').value||'Gracias por confiar en Flora Rodulfo Photography.',W/2,H-230);

  ctx.fillStyle='#8b7f70';
  ctx.font='400 18px Arial';
  ctx.fillText('Momentos que se convierten en recuerdos.',W/2,H-185);

  ctx.fillStyle='#c2985a';
  ctx.beginPath();ctx.arc(W/2,H-135,5,0,Math.PI*2);ctx.fill();

  ctx.textAlign='left';
}

function downloadPNG(){
  draw();
  const a=document.createElement('a');
  a.download='recibo-flora-'+($('numero').value||'recibo')+'.png';
  a.href=canvas.toDataURL('image/png',1);
  document.body.appendChild(a);a.click();a.remove();
}
function printReceipt(){
  draw();
  const data=canvas.toDataURL('image/png',1);
  const w=window.open('','_blank');
  w.document.write('<html><head><title>Recibo Flora</title><style>html,body{margin:0;background:#fff}img{display:block;width:100%;max-width:210mm;margin:auto}@page{size:A4;margin:0}</style></head><body><img src="'+data+'" onload="window.print()"></body></html>');
  w.document.close();
}

['fecha','cliente','conceptoGeneral','metodo','estado','mensaje'].forEach(id=>{
  $(id).addEventListener('input',draw);
  $(id).addEventListener('change',draw);
});
$('numero').addEventListener('input',()=>{saveCurrent();draw()});
$('numero').addEventListener('change',()=>{saveCurrent();draw()});

loadNumber();
addItem('Servicio fotográfico','500');
draw();
</script>
